<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Absensi LPK Yoshida Gakkou</title>
<style>
:root{--bg:#f1f6fd;--card:#fff;--tx:#1c2a44;--mu:#5f6f8c;--bd:#dbe6f6;--pr:#1e4fa3;--pr2:#e6effc;--H:#16a34a;--I:#2563eb;--S:#d97706;--A:#dc2626;--L:#6b7280;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1829;--card:#172238;--tx:#e8eef9;--mu:#93a3bf;--bd:#26365a;--pr:#6ea0ff;--pr2:#1d2e52;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1829;--card:#172238;--tx:#e8eef9;--mu:#93a3bf;--bd:#26365a;--pr:#6ea0ff;--pr2:#1d2e52;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{display:flex;min-height:100vh}
nav{width:220px;background:linear-gradient(180deg,#15397a,#1f5fc2);color:#fff;border-right:0;padding:18px 10px;position:sticky;top:0;height:100vh;overflow:auto;flex:none}
nav h1{font:600 17px Georgia,"Times New Roman",serif;margin:4px 8px 18px;color:#fff;letter-spacing:.3px}nav small{display:block;color:#bcd2f7;font:400 12px system-ui,sans-serif;margin-top:2px}nav .mu{color:#c3d6f6}nav hr{border-top-color:#ffffff33!important}nav button:hover{background:#ffffff1f}
nav button{display:block;width:100%;text-align:left;background:none;border:0;color:#e4eeff;padding:10px 14px;border-radius:10px;cursor:pointer;font:inherit;transition:background .15s}
nav button.on{background:#fff;color:#15397a;font-weight:600}
main{flex:1;padding:22px;min-width:0;max-width:1100px}
h2{margin:0 0 16px;font:600 25px Georgia,"Times New Roman",serif;color:var(--pr);padding-bottom:8px;border-bottom:2px solid var(--pr2)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 2px 12px rgba(30,79,163,.07)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--bd);border-top:3px solid var(--pr);border-radius:12px;padding:12px;box-shadow:0 2px 10px rgba(30,79,163,.06)}.stat b{display:block;font-size:24px}.stat span{color:var(--mu);font-size:13px}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:7px 9px;max-width:100%}
button.b{background:var(--pr);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font:inherit;font-weight:600}
button.g{background:none;border:1px solid var(--bd);color:var(--tx);border-radius:8px;padding:7px 12px;cursor:pointer;font:inherit}
button:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.fm{align-items:flex-end}.fm select{min-width:150px}table input,table select{padding:4px 6px}.fm label{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:600;color:var(--pr)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{padding:8px 10px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}th{color:var(--pr);background:var(--pr2);font-size:13px;font-weight:600}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;color:#fff}
.sH{border-left:4px solid var(--H)}.sI{border-left:4px solid var(--I)}.sS{border-left:4px solid var(--S)}.sA{border-left:4px solid var(--A)}.sL{border-left:4px solid var(--L)}
.mu{color:var(--mu)}.bad{color:var(--A);font-weight:600}.ok{color:var(--H);font-weight:600}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:10px;display:none;z-index:9}
#login{max-width:360px;margin:12vh auto;padding:0 16px}
@media(max-width:760px){#app{flex-direction:column}nav{width:100%;height:auto;position:static;display:flex;flex-wrap:wrap;gap:4px}nav h1{width:100%}nav button{width:auto}main{padding:14px}}
.ov{position:fixed;inset:0;background:rgba(10,25,60,.45);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}.md{background:var(--card);border-radius:16px;padding:22px;max-width:430px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.3)}.wide .md{max-width:920px}.md h3{margin:0 0 10px;font:600 19px Georgia,serif;color:var(--pr)}.md p{margin:0;line-height:1.5}
@media print{nav,.np{display:none!important}main{padding:0}}

body{background:linear-gradient(180deg,var(--pr2) 0,var(--bg) 380px) fixed var(--bg)}
main{max-width:1320px;padding:24px 28px}
nav{width:236px;background:linear-gradient(180deg,#0e2556 0%,#15397a 50%,#1c4d9c 100%)}
@media(min-width:761px){nav{display:flex;flex-direction:column}.navart{margin-top:auto;margin:auto -10px -18px;border-radius:0}}
.brand{display:flex;gap:10px;align-items:center;margin:2px 6px 18px;color:#fff}.brand-logo{width:48px;height:48px;flex:none;object-fit:contain;background:#fff;border-radius:7px;padding:2px}.brand b{font:700 14px/1.2 Georgia,serif;display:block}.brand small{display:block;color:#bcd2f7;font:400 11px system-ui,sans-serif;margin-top:2px}
nav button .ic{display:inline-block;width:24px}
.navuser{margin:12px 6px 6px;padding:10px 12px;background:#ffffff14;border-radius:10px;color:#fff}.navuser b{display:block;font-size:13px}.navuser small{color:#bcd2f7}
.navart{display:block}@media(max-width:760px){.navart{display:none}}
.ph{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;flex-wrap:wrap;margin-bottom:18px}.ph h2{margin:0 0 2px;border:0;padding:0}

async function log(action,detail){try{await db.collection("audit").doc(Date.now()+"_"+Math.random().toString(36).slice(2,6)).set({at:new Date().toISOString(),by:me?me.name+" ("+me.phone+")":"-",byId:me?.id||null,action,detail})}catch(e){}}
function sub(name,cb,q){const c=q||db.collection(name);return c.onSnapshot(s=>{const o={};s.docs.forEach(d=>o[d.id]=d.data());cb(o);ok[name]=1;schedule()},e=>{console.error(name,e);ok[name]=1;schedule()})}
let raf;function schedule(){cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{if(me&&dirty&&!ok._force)return;render()})}
let dataUnsubs=[],sessionStarted=false,heartbeatTimer=null;
function stopDataSubscriptions(){dataUnsubs.forEach(fn=>{try{if(typeof fn==='function')fn()}catch(e){}});dataUnsubs=[];sessionStarted=false;Object.keys(ok).forEach(k=>delete ok[k]);S={users:{},classes:{},students:{},att:{},grades:{},presence:{},batches:{},audit:[]};window._ygCalEvents=[];window._ygCalLoaded=false;window._ygCalState=null}
function startSession(){
  if(sessionStarted)return;
  sessionStarted=true;window._gr=Date.now();beat();
  dataUnsubs.push(sub("users",o=>S.users=o));
  dataUnsubs.push(sub("classes",o=>S.classes=o));
  dataUnsubs.push(sub("batches",o=>S.batches=o));
  dataUnsubs.push(sub("students",o=>S.students=o));
  dataUnsubs.push(sub("attendance",o=>S.att=o));
  dataUnsubs.push(sub("grades",o=>S.grades=o));
  dataUnsubs.push(db.collection('calendar').onSnapshot(s=>{
    window._ygCalEvents=s.docs.map(d=>({id:d.id,...d.data()}));window._ygCalLoaded=true;
    const c=window._ygCalState;
    if(c){c.events=window._ygCalEvents;c.loading=false;if(c.open&&!c.form&&view==='dash'){const root=$('#main');if(root){const old=$('#ygCalOverlay');if(old){old.remove();root.insertAdjacentHTML('beforeend',ygCalPanelHTML());bindYgCalendarDemo(root)}}}}
  },e=>{console.error('calendar',e);window._ygCalLoaded=true;window._ygCalError=e.message||'Gagal memuat kalender';const c=window._ygCalState;if(c)c.loading=false;if(c?.open&&!c.form&&view==='dash')render()}));
  dataUnsubs.push(db.collection('presence').onSnapshot(s=>{const o={};s.docs.forEach(d=>o[d.id]=d.data());S.presence=o;if(view==='sensei'&&me&&!dirty)render()},e=>console.error('presence',e)));
  dataUnsubs.push(db.collection("audit").orderBy("at","desc").limit(100).onSnapshot(s=>{S.audit=s.docs.map(d=>d.data());ok.audit=1;schedule()},e=>{console.error('audit',e);ok.audit=1;schedule()}));
  if(!heartbeatTimer)heartbeatTimer=setInterval(()=>{if(me){beat();if(view==='sensei'&&!dirty)render()}},45000);
}
async function init(){
  if(!db||!window.ygSupabase){const msg=window.ygConfigError||'Supabase belum dapat diinisialisasi.';$("#root").innerHTML=`<div id="login"><div class="card"><h2>Konfigurasi belum siap</h2><p class="mu">${esc(msg)}</p></div></div>`;return}
  const loadProfile = async session => {
    if(!session){stopDataSubscriptions();me=null;render();return}
    const {data,error}=await window.ygSupabase.from('app_users').select('*').eq('id',session.user.id).maybeSingle();
    if(error){console.error('Gagal membaca profil app_users:',error);const er=$('#er');if(er)er.textContent='Gagal membaca profil akun: '+error.message;return}
    if(!data||data.active===false){me=null;await window.ygSupabase.auth.signOut();render();return}
    me={...data,email:data.email,phone:data.phone||data.email};window._gr=Date.now();startSession();render();
  };
  const {data:{session},error}=await window.ygSupabase.auth.getSession();
  if(error)console.error('Gagal memeriksa sesi login:',error);
  if(session) await loadProfile(session); else {stopDataSubscriptions();me=null;render()}
  window.ygSupabase.auth.onAuthStateChange((_event,session)=>{setTimeout(()=>{loadProfile(session).catch(e=>{console.error('Gagal memuat profil pengguna:',e);const er=$('#er');if(er)er.textContent='Login berhasil, tetapi profil akun gagal dimuat. Periksa izin tabel app_users dan data akun admin.';});},0);});
}

 pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

 for(let p=1;p<=doc.numPages;p++){const tc=await (await doc.getPage(p)).getTextContent(),lines=[];
  tc.items.filter(i=>i.str.trim()).forEach(i=>{const y=Math.round(i.transform[5]/3);let l=lines.find(q=>Math.abs(q.y-y)<=1);if(!l){l={y,c:[]};lines.push(l)}l.c.push({x:i.transform[4],s:i.str.trim(),w:i.width})});

 m.querySelectorAll('[data-s]').forEach(el=>el.oninput=()=>{const n=el.dataset.s;f.sel[n]=el.value;el.closest('tr').querySelector('[data-c]').checked=true;$('#cn').textContent='Dipilih: '+cn()+' siswa'});
 $('#gs').onclick=async()=>{const es=Object.entries(f.sel);if(!es.length){toast('Pilih minimal satu siswa.');return}
  const bad=es.filter(([,v])=>v===''||isNaN(Number(v))||Number(v)<minScore||Number(v)>maxScore);if(bad.length){toast('Isi nilai '+scoreRange+' untuk semua siswa yang dipilih ('+bad.length+' belum atau di luar batas).');return}
  try{await Promise.all(es.map(([n,v])=>{const id=window._gid&&S.grades[window._gid]?.nis===n?window._gid:Date.now()+'_'+Math.random().toString(36).slice(2,6);return db.collection('grades').doc(id).set({date:f.date,nis:n,category:f.cat,type:f.type,title:f.title,score:Number(v),note:f.note,by:me.name,byPhone:me.phone,byId:me.id,at:new Date().toISOString()})}));
   await log('nilai',es.length+' nilai '+f.cat+(f.title?' ('+f.title+')':'')+' - '+clsB(f.cid));f.sel={};f.note='';window._gid=null;dirty=false;toast(es.length+' nilai tersimpan.');render()}catch(e){toast('Gagal: '+(e.message||e.code))}};
 if($('#gc'))$('#gc').onclick=()=>{window._gid=null;f.sel={};dirty=false;render()};
 m.querySelectorAll('[data-ge]').forEach(b=>b.onclick=()=>{const g=S.grades[b.dataset.ge],c=S.classes[S.students[g.nis]?.classId];Object.assign(f,{date:g.date,cat:g.category,type:g.type,title:g.title||'',note:g.note||'',cid:S.students[g.nis]?.classId||f.cid,b:c?(noB(c)?'_none':c.batchId):f.b,sel:{[g.nis]:String(g.score)}});window._gid=b.dataset.ge;dirty=false;render()});
 m.querySelectorAll('[data-gx]').forEach(b=>b.onclick=async()=>{dirty=false;if(await confirmX('Hapus nilai ini?','Hapus')){const g=S.grades[b.dataset.gx];await db.collection('grades').doc(b.dataset.gx).delete();await log('nilai','Hapus '+(S.students[g.nis]?.name||g.nis)+' '+g.category+' '+g.score)}})}
function mon3(m){
 const M=window._M=window._M||{b:'',c:'',q:'',p:{k:'all'}};
 if(M.b&&M.b!=='_none'&&!S.batches?.[M.b])M.b='';if(M.c&&!S.classes[M.c])M.c='';if(M.c&&M.b&&!classesIn(M.b).find(x=>x[0]===M.c))M.c='';
 const {r:rng,label:pl_}=perRange(M.p);
 const sel=window._mset=window._mset||{};Object.keys(sel).forEach(k=>{if(!S.students[k])delete sel[k]});
 const q=M.q.toLowerCase().trim();
 const fl=scopeS(M.b,M.c).filter(([n,s])=>!q||(n+' '+s.name).toLowerCase().includes(q)).sort((a,b)=>NAT(ckey(a[1].classId),ckey(b[1].classId))||byName(a,b));
 const shown=fl.slice(0,150),inf={};shown.forEach(([n])=>inf[n]=an(n,rng));
 const ns=Object.keys(sel).sort((a,b)=>byName([a,S.students[a]],[b,S.students[b]])),DD=ns.map(n=>({n,s:S.students[n],a:an(n,rng)}));
 let body=`<div class='card mu'>Klik nama siswa pada daftar di atas untuk melihat detailnya. Bisa memilih lebih dari satu siswa.</div>`;
 if(DD.length===1){const n=DD[0].n,i=fl.findIndex(x=>x[0]===n);body=`<div class='card'><div class='row' style='margin:0;justify-content:space-between'><b style='font-size:17px'>${esc(DD[0].s.name)} <span class='mu' style='font-weight:400'>${esc(clsB(DD[0].s.classId))}</span></b><div class='row np' style='margin:0'><button class='g' id='pv' ${i>0?'':'disabled'}>‹ Sebelumnya</button><span class='mu'>${i>=0?(i+1)+' / '+fl.length:''}</span><button class='g' id='nx' ${i>=0&&i<fl.length-1?'':'disabled'}>Berikutnya ›</button></div></div></div>`+monDetail(n,rng,pl_)}
 else if(DD.length>1)body=`<div class='card'><b style='font-size:17px'>Perbandingan ${DD.length} siswa</b> <span class='mu'>(${esc(pl_)})</span><div class='tw'><table><tr><th>NIS</th><th>Nama</th><th>Kelas</th><th>H</th><th>I</th><th>S</th><th>A</th><th>L</th><th>% Hadir</th><th>Rata nilai</th><th>Predikat</th><th>Tren</th><th>Status</th></tr>${DD.map(({n,s,a})=>`<tr><td>${esc(n)}</td><td>${esc(s.name)}</td><td>${esc(cls(s.classId))}</td><td>${a.at.H}</td><td>${a.at.I}</td><td>${a.at.S}</td><td>${a.at.A}</td><td>${a.at.L}</td><td>${a.pct===null?'-':fm(a.pct)+'%'}</td><td>${fm(a.av)}</td><td>${gl(a.av)}</td><td>${a.tr}</td><td>${stp(a.st)}</td></tr>`).join('')}</table></div></div>`+DD.map(({n,s,a})=>`<details style='margin-bottom:14px'><summary class='card' style='cursor:pointer;margin-bottom:8px'><b>${esc(s.name)}</b> <span class='mu'>${esc(n)} - ${esc(cls(s.classId))}</span> ${stp(a.st)}</summary>${monDetail(n,rng,pl_)}</details>`).join('');
 m.innerHTML=`${ph('Monitoring Siswa','Pantau kehadiran dan perkembangan nilai siswa per batch dan kelas')}
 <div class='card'><div class='tb'><div class='fld'><span>Batch</span><select id='mb'>${bOpts(M.b,'Semua batch')}</select></div><div class='fld'><span>Kelas</span><select id='mc'>${cOpts(M.b,M.c,'Semua kelas')}</select></div><div class='fld'><span>Periode</span>${perHTML(M.p,'mp')}</div><div class='fld'><span>Cari siswa</span><input id='mq' placeholder='Nama atau NIS' value='${esc(M.q)}' style='width:190px'></div></div></div>
 <div class='card'><div class='row' style='justify-content:space-between;margin-bottom:8px'><b style='font-size:17px'>Daftar Siswa <span class='mu' style='font-weight:400'>${fl.length} siswa · ${ns.length} dipilih</span></b><div class='row np' style='margin:0'><button class='g' id='ma'>Pilih semua yang tampil</button><button class='g' id='mx'>Kosongkan pilihan</button>${ns.length&&can('export')?`<button class='b' id='mpf'>Unduh PDF (${ns.length})</button>`:''}</div></div>
 <div class='tw' style='max-height:380px;overflow:auto'><table><tr><th></th><th>NIS</th><th>Nama</th><th>Kelas</th><th>Kehadiran</th><th>Rata nilai</th><th>Status</th></tr>${shown.map(([n,s])=>{const a=inf[n];return `<tr class='clk ${sel[n]?'sel':''}' data-ms='${esc(n)}'><td><input type='checkbox' ${sel[n]?'checked':''} style='pointer-events:none'></td><td>${esc(n)}</td><td><b>${esc(s.name)}</b></td><td>${esc(cls(s.classId))}</td><td>${a.pct===null?'–':fm(a.pct)+'%'}</td><td>${fm(a.av)}</td><td>${stp(a.st)}</td></tr>`}).join('')||"<tr><td colspan='7' class='mu'>Tidak ada siswa yang cocok.</td></tr>"}</table></div>${fl.length>150?`<p class='mu'>Menampilkan 150 siswa pertama. Persempit dengan batch, kelas, atau pencarian.</p>`:''}</div>${body}`;
 $('#mb').onchange=e=>{M.b=e.target.value;M.c='';dirty=false;render()};$('#mc').onchange=e=>{M.c=e.target.value;dirty=false;render()};
 perBind(M.p,'mp',()=>{dirty=false;render()});
 $('#mq').oninput=e=>{M.q=e.target.value;const p=e.target.selectionStart;dirty=false;render();const x=$('#mq');x.focus();x.setSelectionRange(p,p)};
 m.querySelectorAll('[data-ms]').forEach(r=>r.onclick=()=>{const i=r.dataset.ms;if(sel[i])delete sel[i];else sel[i]=1;dirty=false;render()});
 $('#ma').onclick=()=>{fl.forEach(([i])=>sel[i]=1);dirty=false;render()};$('#mx').onclick=()=>{Object.keys(sel).forEach(k=>delete sel[k]);dirty=false;render()};
 if($('#pv'))$('#pv').onclick=()=>{const i=fl.findIndex(x=>x[0]===DD[0].n);if(i>0){Object.keys(sel).forEach(k=>delete sel[k]);sel[fl[i-1][0]]=1;render()}};
 if($('#nx'))$('#nx').onclick=()=>{const i=fl.findIndex(x=>x[0]===DD[0].n);if(i>=0&&i<fl.length-1){Object.keys(sel).forEach(k=>delete sel[k]);sel[fl[i+1][0]]=1;render()}};
 if($('#mpf'))$('#mpf').onclick=()=>{const one=DD.length===1,secs=[];if(!one)secs.push({t:'Perbandingan siswa',head:['NIS','Nama','Kelas','% Hadir','Rata nilai','Tren','Status'],rows:DD.map(({n,s,a})=>[n,s.name,cls(s.classId),a.pct===null?'-':a.pct+'%',a.av??'-',a.tr,a.st])});DD.forEach(({n,s,a})=>secs.push(...secsFor(n,s,a,one?'':s.name+' - ')));pdf('Laporan Monitoring Siswa',one?'Nama: '+DD[0].s.name+'  |  NIS: '+DD[0].n+'  |  Kelas: '+clsB(DD[0].s.classId)+'  |  Periode: '+pl_:'Jumlah siswa: '+DD.length+'  |  Periode: '+pl_,secs,'Monitoring-'+(one?DD[0].n:'beberapa-siswa')+'.pdf','portrait')}}
function kelas2(m){
 const bl=bList();
 const hint=e=>/row-level|policy|permission|denied/i.test(e.message||'')?'Gagal: periksa hak akses Master Admin dan kebijakan RLS di Supabase. Jangan jalankan SQL tanpa pemeriksaan.':'Gagal: '+(e.message||e.code||'');
 const cr=classesIn('');
 m.innerHTML=`${ph('Data Kelas & Batch','Satu batch biasanya berisi 3-4 kelas. Atur batch dan kelas di sini')}
 <div class='card'><b style='font-size:17px'>Batch</b><div class='row' style='margin:10px 0'><input id='bn' placeholder='Nama batch, mis. Batch 1'><button class='b' id='ba'>+ Tambah batch</button></div><div class='tw'><table><tr><th>Batch</th><th>Jumlah kelas</th><th>Jumlah siswa</th><th></th></tr>${bl.map(([i,b])=>{const cs=classesIn(i),ids=new Set(cs.map(x=>x[0]));return `<tr><td><b>${esc(b.name)}</b></td><td>${cs.length}</td><td>${Object.values(S.students).filter(s=>ids.has(s.classId)).length}</td><td><button class='g' data-br='${i}'>Ubah nama</button> ${adm()?`<button class='g' data-bd='${i}'>Hapus permanen</button>`:''}</td></tr>`}).join('')||"<tr><td colspan='4' class='mu'>Belum ada batch. Tambahkan batch, lalu pilih batch untuk tiap kelas di tabel bawah.</td></tr>"}</table></div></div>
 <div class='card'><b style='font-size:17px'>Kelas</b><div class='row' style='margin:10px 0'><input id='kn' placeholder='Nama kelas baru, mis. N5-1'><select id='kb'><option value=''>- Tanpa batch -</option>${bOpts('')}</select><button class='b' id='ka'>+ Tambah kelas</button></div><div class='tw'><table><tr><th>Kelas</th><th>Batch</th><th>Siswa</th><th></th></tr>${cr.map(([i,c])=>`<tr><td><b>${esc(c.name)}</b></td><td><select data-cb='${i}'><option value=''>- Tanpa batch -</option>${bl.map(([k,b])=>`<option value='${k}' ${c.batchId===k?'selected':''}>${esc(b.name)}</option>`).join('')}</select></td><td>${Object.values(S.students).filter(s=>s.classId===i).length}</td><td><button class='g' data-r='${i}'>Ubah nama</button> <button class='g' data-d='${i}'>Hapus</button></td></tr>`).join('')||"<tr><td colspan='4' class='mu'>Belum ada kelas.</td></tr>"}</table></div></div>`;
 $('#ba').onclick=async()=>{const n=$('#bn').value.trim();if(!n)return;if(bl.some(x=>x[1].name.toLowerCase()===n.toLowerCase())){toast('Nama batch sudah ada.');return}try{await db.collection('batches').doc('b'+Date.now()).set({name:n});await log('batch','Tambah '+n);dirty=false;toast('Batch ditambahkan.')}catch(e){toast(hint(e))}};
 $('#ka').onclick=async()=>{const n=$('#kn').value.trim();if(!n)return;try{await db.collection('classes').doc('c'+Date.now()).set({name:n,batchId:$('#kb').value||''});await log('kelas','Tambah '+n);dirty=false;toast('Kelas ditambahkan.')}catch(e){toast(hint(e))}};
 m.querySelectorAll('[data-br]').forEach(b=>b.onclick=async()=>{const n=await askX('Ubah nama batch',S.batches[b.dataset.br].name);dirty=false;if(n){try{await db.collection('batches').doc(b.dataset.br).set({...S.batches[b.dataset.br],name:n});await log('batch','Ubah nama → '+n)}catch(e){toast(hint(e))}}});
 m.querySelectorAll('[data-bd]').forEach(b=>b.onclick=async()=>{if(!adm()){toast('Hanya Master Admin yang boleh menghapus Batch.');return}const bid=b.dataset.bd,batch=S.batches[bid];if(!batch)return;if(classesIn(bid).length){toast('Batch masih memiliki kelas. Pindahkan atau arsipkan kelasnya terlebih dahulu.');return}if(Object.values(S.students).some(s=>Object.values(S.classes).some(c=>c.batchId===bid&&s.classId===c.id))){toast('Masih ada siswa yang terkait dengan Batch ini.');return}dirty=false;if(await confirmX('Hapus permanen Batch '+batch.name+'? Tindakan ini tidak dapat dibatalkan.','Hapus permanen')){try{await db.collection('batches').doc(bid).delete();await log('batch','Hapus permanen '+batch.name);toast('Batch dihapus.')}catch(e){toast(hint(e))}}});
 m.querySelectorAll('[data-cb]').forEach(s=>s.onchange=async()=>{const c=S.classes[s.dataset.cb];dirty=false;try{await db.collection('classes').doc(s.dataset.cb).set({...c,batchId:s.value});await log('kelas',c.name+' → '+(s.value?bName(s.value):'tanpa batch'));toast('Batch kelas diperbarui.')}catch(e){toast(hint(e))}});
 m.querySelectorAll('[data-r]').forEach(b=>b.onclick=async()=>{const c=S.classes[b.dataset.r],n=await askX('Ubah nama kelas',c.name);dirty=false;if(n){try{await db.collection('classes').doc(b.dataset.r).set({...c,name:n});await log('kelas','Ubah nama → '+n)}catch(e){toast(hint(e))}}});
 m.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{if(Object.values(S.students).some(s=>s.classId===b.dataset.d)){toast('Masih ada siswa di kelas ini. Pindahkan dulu.');return}dirty=false;if(await confirmX('Hapus kelas '+S.classes[b.dataset.d].name+'?','Hapus')){try{await db.collection('classes').doc(b.dataset.d).delete();await log('kelas','Hapus '+S.classes[b.dataset.d].name)}catch(e){toast(hint(e))}}});
}
function loginView(){
 $('#root').innerHTML=`<div id='login'><div class='card'><h2>Absensi Yoshida Gakkou</h2><p class='mu'>Masuk menggunakan email dan password akun testing yang diberikan Master Admin.</p><input id='em' type='email' placeholder='Email' autocomplete='username' style='width:100%;margin-bottom:8px'><input id='pw' type='password' placeholder='Password' autocomplete='current-password' style='width:100%;margin-bottom:10px'><button class='b' id='go' style='width:100%'>Masuk</button><p id='er' class='bad'></p></div></div>`;
 const go=async()=>{const er=$('#er');er.textContent='';try{const {error}=await window.ygSupabase.auth.signInWithPassword({email:$('#em').value.trim().toLowerCase(),password:$('#pw').value});if(error)throw error;}catch(e){er.textContent='Login gagal: '+(e.message||'Periksa email dan password.')}};
 $('#go').onclick=go;$('#pw').onkeydown=e=>{if(e.key==='Enter')go()}
}
function pwView(){
 $('#root').innerHTML=`<div id='login'><div class='card'><h2>Ganti password</h2><p class='mu'>Masukkan password baru untuk akun Anda.</p><input id='p1' type='password' placeholder='Password baru (min 8 karakter)' autocomplete='new-password' style='width:100%;margin-bottom:8px'><input id='p2' type='password' placeholder='Ulangi password baru' autocomplete='new-password' style='width:100%;margin-bottom:10px'><button class='b' id='go' style='width:100%'>Simpan password</button><button class='g' id='cx' style='width:100%;margin-top:8px'>Batal</button><p id='er' class='bad'></p></div></div>`;
 $('#cx').onclick=()=>{window._cpw=false;render()};
 $('#go').onclick=async()=>{const p1=$('#p1').value,p2=$('#p2').value,er=$('#er');if(p1.length<8){er.textContent='Password minimal 8 karakter.';return}if(p1!==p2){er.textContent='Password tidak sama.';return}const {error}=await window.ygSupabase.auth.updateUser({password:p1});if(error){er.textContent='Gagal mengganti password: '+error.message;return}window._cpw=false;await log('akun','Ganti password');toast('Password tersimpan.');render()}
}
function logv(m){if(!adm()){m.innerHTML=denied('Riwayat Perubahan');return}m.innerHTML=`<h2>Riwayat Perubahan</h2><div class="card tw"><table><tr><th>Waktu</th><th>Oleh</th><th>Aksi</th><th>Detail</th></tr>${S.audit.map(a=>`<tr><td>${new Date(a.at).toLocaleString("id-ID")}</td><td>${esc(a.by)}</td><td>${esc(a.action)}</td><td style="white-space:normal">${esc(a.detail)}</td></tr>`).join("")}</table></div>`}
init();
</script>
