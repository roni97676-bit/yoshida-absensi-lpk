<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Absensi LPK Yoshida Gakkou</title>
<style>
:root{--bg:#f1f6fd;--card:#fff;--tx:#1c2a44;--mu:#5f6f8c;--bd:#dbe6f6;--pr:#1e4fa3;--pr2:#e6effc;--H:#16a34a;--I:#2563eb;--S:#d97706;--A:#dc2626;--L:#6b7280;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1829;--card:#172238;--tx:#e8eef9;--mu:#93a3bf;--bd:#26365a;--pr:#6ea0ff;--pr2:#1d2e52;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1829;--card:#172238;--tx:#e8eef9;--mu:#93a3bf;--bd:#26365a;--pr:#6ea0ff;--pr2:#1d2e52;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{display:flex;min-height:100vh}
nav{width:220px;background:linear-gradient(180deg,#15397a,#1f5fc2);color:#fff;border-right:0;padding:18px 10px;position:sticky;top:0;height:100vh;overflow:auto;flex:none}
nav h1{font:600 17px Georgia,"Times New Roman",serif;margin:4px 8px 18px;color:#fff;letter-spacing:.3px}nav small{display:block;color:#bcd2f7;font:400 12px system-ui,sans-serif;margin-top:2px}nav .mu{color:#c3d6f6}nav hr{border-top-color:#ffffff33!important}nav button:hover{background:#ffffff1f}
nav button{display:block;width:100%;text-align:left;background:none;border:0;color:#e4eeff;padding:10px 14px;border-radius:10px;cursor:pointer;font:inherit;transition:background .15s}
nav button.on{background:#fff;color:#15397a;font-weight:600}
main{flex:1;padding:22px;min-width:0;max-width:1100px}
h2{margin:0 0 16px;font:600 25px Georgia,"Times New Roman",serif;color:var(--pr);padding-bottom:8px;border-bottom:2px solid var(--pr2)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 2px 12px rgba(30,79,163,.07)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--bd);border-top:3px solid var(--pr);border-radius:12px;padding:12px;box-shadow:0 2px 10px rgba(30,79,163,.06)}.stat b{display:block;font-size:24px}.stat span{color:var(--mu);font-size:13px}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:7px 9px;max-width:100%}
button.b{background:var(--pr);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font:inherit;font-weight:600}
button.g{background:none;border:1px solid var(--bd);color:var(--tx);border-radius:8px;padding:7px 12px;cursor:pointer;font:inherit}
button:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.fm{align-items:flex-end}.fm select{min-width:150px}table input,table select{padding:4px 6px}.fm label{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:600;color:var(--pr)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{padding:8px 10px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}th{color:var(--pr);background:var(--pr2);font-size:13px;font-weight:600}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;color:#fff}
.sH{border-left:4px solid var(--H)}.sI{border-left:4px solid var(--I)}.sS{border-left:4px solid var(--S)}.sA{border-left:4px solid var(--A)}.sL{border-left:4px solid var(--L)}
.mu{color:var(--mu)}.bad{color:var(--A);font-weight:600}.ok{color:var(--H);font-weight:600}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:10px;display:none;z-index:9}
#login{max-width:360px;margin:12vh auto;padding:0 16px}
@media(max-width:760px){#app{flex-direction:column}nav{width:100%;height:auto;position:static;display:flex;flex-wrap:wrap;gap:4px}nav h1{width:100%}nav button{width:auto}main{padding:14px}}
.ov{position:fixed;inset:0;background:rgba(10,25,60,.45);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}.md{background:var(--card);border-radius:16px;padding:22px;max-width:430px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.3)}.wide .md{max-width:920px}.md h3{margin:0 0 10px;font:600 19px Georgia,serif;color:var(--pr)}.md p{margin:0;line-height:1.5}
@media print{nav,.np{display:none!important}main{padding:0}}

  tc.items.filter(i=>i.str.trim()).forEach(i=>{const y=Math.round(i.transform[5]/3);let l=lines.find(q=>Math.abs(q.y-y)<=1);if(!l){l={y,c:[]};lines.push(l)}l.c.push({x:i.transform[4],s:i.str.trim(),w:i.width})});

 const gs=Object.entries(S.grades).filter(([,g])=>S.students[g.nis]?.classId===f.cid).sort((a,b)=>(b[1].date+b[1].at).localeCompare(a[1].date+a[1].at)).slice(0,40);
 const op=(a,v)=>a.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('');
 const mine=g=>can('edit')||g.byPhone===me.phone,cn=()=>Object.keys(f.sel).length;
 m.innerHTML=`<h2>Penilaian</h2><div class='card'><div class='row fm'><label>Tanggal<input type='date' data-f='date' value='${f.date}'></label><label>Kelas<select data-f='cid'>${Object.entries(S.classes).map(([i,c])=>`<option value='${i}' ${i===f.cid?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label><label>Kategori<select data-f='cat'>${op(CATS,f.cat)}</select></label><label>Jenis<select data-f='type'>${op(TYPES,f.type)}</select></label><label style='min-width:220px'>Nama ujian / materi<input style='width:100%' data-f='title' value='${esc(f.title)}'></label><label style='min-width:200px'>Catatan<input style='width:100%' data-f='note' value='${esc(f.note)}'></label></div>
 <div class='row fm'><label style='min-width:240px'>Cari siswa<input id='sq' placeholder='Cari NIS atau nama' value='${esc(window._nq||'')}'></label><label style='flex-direction:row;align-items:center;gap:6px'><input type='checkbox' id='sa'> Pilih semua yang tampil</label><label>Nilai sama untuk yang dipilih<input type='number' id='sv' min='0' max='100' style='width:110px'></label><button class='g' id='sp'>Terapkan</button><span class='mu' id='cn'>Dipilih: ${cn()}</span></div>
 <div class='tw' style='max-height:420px;overflow:auto'><table><tr><th></th><th>NIS</th><th>Nama</th><th>Nilai (0-100)</th></tr>${ss.map(([n,s])=>`<tr><td><input type='checkbox' data-c='${esc(n)}' ${n in f.sel?'checked':''}></td><td>${esc(n)}</td><td>${esc(s.name)}</td><td><input type='number' min='0' max='100' data-s='${esc(n)}' value='${esc(f.sel[n]??'')}' style='width:90px'></td></tr>`).join('')||`<tr><td colspan='4' class='mu'>Tidak ada siswa aktif yang cocok.</td></tr>`}</table></div>
 <div class='row' style='margin:12px 0 0'><button class='b' id='gs'>${window._gid?'Simpan perubahan':'Simpan nilai'}</button>${window._gid?`<button class='g' id='gc'>Batal</button>`:''}<span class='mu'>Centang beberapa siswa, isi nilai masing-masing (atau pakai nilai sama), lalu simpan sekali. Kosongkan nilai bila belum ada, jangan isi 0.</span></div></div>
 <div class='card'><b>Penilaian terakhir kelas ini</b><div class='tw'><table><tr><th>Tanggal</th><th>NIS</th><th>Nama</th><th>Kategori</th><th>Ujian / Materi</th><th>Jenis</th><th>Nilai</th><th>Catatan</th><th></th></tr>${gs.map(([id,g])=>`<tr><td>${esc(g.date)}</td><td>${esc(g.nis)}</td><td>${esc(S.students[g.nis]?.name)}</td><td>${esc(g.category)}</td><td>${esc(g.title)}</td><td>${esc(g.type)}</td><td class='${g.score<70?'bad':g.score>=80?'ok':''}'>${g.score}</td><td>${esc(g.note)}</td><td>${mine(g)?`<button class='g' data-ge='${id}'>Edit</button> <button class='g' data-gx='${id}'>Hapus</button>`:''}</td></tr>`).join('')||`<tr><td colspan='9' class='mu'>Belum ada penilaian.</td></tr>`}</table></div></div>`;
 m.querySelectorAll('[data-f]').forEach(e=>{e.oninput=()=>{f[e.dataset.f]=e.value};e.onchange=()=>{f[e.dataset.f]=e.value;if(e.dataset.f==='cid'){f.sel={};render()}}});
 $('#sq').oninput=e=>{window._nq=e.target.value;const p=e.target.selectionStart;render();const x=$('#sq');x.focus();x.setSelectionRange(p,p)};
 $('#sa').onchange=e=>{ss.forEach(([n])=>{if(e.target.checked)f.sel[n]=f.sel[n]??'';else delete f.sel[n]});render()};
 $('#sp').onclick=()=>{const v=$('#sv').value,x=Number(v);if(v===''||isNaN(x)||x<0||x>100){toast('Isi nilai 0-100.');return}Object.keys(f.sel).forEach(n=>f.sel[n]=String(x));render()};
 m.querySelectorAll('[data-c]').forEach(el=>el.onchange=()=>{const n=el.dataset.c;if(el.checked)f.sel[n]=f.sel[n]??'';else delete f.sel[n];$('#cn').textContent='Dipilih: '+cn()});
 m.querySelectorAll('[data-s]').forEach(el=>el.oninput=()=>{const n=el.dataset.s;f.sel[n]=el.value;el.closest('tr').querySelector('[data-c]').checked=true;$('#cn').textContent='Dipilih: '+cn()});
 $('#gs').onclick=async()=>{const es=Object.entries(f.sel);if(!es.length){toast('Pilih minimal satu siswa.');return}
  const bad=es.filter(([,v])=>v===''||isNaN(Number(v))||Number(v)<0||Number(v)>100);if(bad.length){toast('Isi nilai 0-100 untuk semua siswa yang dipilih ('+bad.length+' belum).');return}
  try{await Promise.all(es.map(([n,v])=>{const id=window._gid&&S.grades[window._gid]?.nis===n?window._gid:Date.now()+'_'+Math.random().toString(36).slice(2,6);return db.collection('grades').doc(id).set({date:f.date,nis:n,category:f.cat,type:f.type,title:f.title,score:Number(v),note:f.note,by:me.name,byPhone:me.phone,at:new Date().toISOString()})}));
   await log('nilai',es.length+' nilai '+f.cat+(f.title?' ('+f.title+')':'')+' - '+cls(f.cid));f.sel={};f.note='';window._gid=null;dirty=false;toast(es.length+' nilai tersimpan.');render()}catch(e){toast('Gagal: '+(e.message||e.code))}};
 if($('#gc'))$('#gc').onclick=()=>{window._gid=null;f.sel={};dirty=false;render()};
 m.querySelectorAll('[data-ge]').forEach(b=>b.onclick=()=>{const g=S.grades[b.dataset.ge];Object.assign(f,{date:g.date,cat:g.category,type:g.type,title:g.title||'',note:g.note||'',cid:S.students[g.nis]?.classId||f.cid,sel:{[g.nis]:String(g.score)}});window._gid=b.dataset.ge;dirty=false;render()});
 m.querySelectorAll('[data-gx]').forEach(b=>b.onclick=async()=>{dirty=false;if(await confirmX('Hapus nilai ini?','Hapus')){const g=S.grades[b.dataset.gx];await db.collection('grades').doc(b.dataset.gx).delete();await log('nilai','Hapus '+(S.students[g.nis]?.name||g.nis)+' '+g.category+' '+g.score)}})}
function monDetail(n,mo){const s=S.students[n],a=an(n,mo),notes=a.G.filter(g=>g.note).sort((x,y)=>y.date.localeCompare(x.date)).slice(0,5);
 return `<div class='card'><div class='grid' style='margin:0'><div><span class='mu'>NIS</span><br><b>${esc(n)}</b></div><div><span class='mu'>Kelas</span><br><b>${esc(cls(s.classId))}</b></div><div><span class='mu'>Jenis kelamin</span><br><b>${esc(s.gender)}</b></div><div><span class='mu'>Periode</span><br><b>${esc(s.joined||'-')}</b></div><div><span class='mu'>Selesai</span><br><b>${esc(s.ended||'-')}</b></div><div><span class='mu'>Status</span><br><b>${esc(s.status)}</b></div></div></div>
 <div class='card'><b>Absensi</b> <span class='mu'>(${mo||'semua periode'})</span><div class='row' style='margin:10px 0 0'>${ST.map(k=>`<span class='tag' style='background:${SC[k]}'>${SN[k]} ${a.at[k]}</span>`).join(' ')} <b>Kehadiran: ${a.pct===null?'-':a.pct+'%'}</b> ${a.pct===null?'':cat(a.pct)}</div></div>
 <div class='card'><b>Nilai per kategori</b><div class='tw'><table><tr><th>Kategori</th><th>Rata-rata</th><th>Predikat</th><th></th></tr>${Object.entries(a.cats).map(([c,v])=>`<tr><td>${esc(c)}</td><td>${v}</td><td>${gl(v)}</td><td>${bar(v)}</td></tr>`).join('')||`<tr><td colspan='4' class='mu'>Belum ada nilai.</td></tr>`}</table></div><p>Rata-rata keseluruhan: <b>${a.av??'-'}</b> (${gl(a.av)})</p></div>
 <div class='card'><b>Perkembangan per 2 minggu</b> <span class='mu'>(seluruh riwayat)</span><div class='tw'><table><tr><th>Periode mulai</th><th>Rata-rata</th><th>Jumlah penilaian</th><th></th></tr>${a.pr.map(([k,v,c])=>`<tr><td>${pl(k)}</td><td>${v}</td><td>${c}</td><td>${bar(v)}</td></tr>`).join('')||`<tr><td colspan='4' class='mu'>Belum ada nilai.</td></tr>`}</table></div><p>Tren: <b>${a.tr}</b> &nbsp; Status: ${stb(a.st)}</p></div>
 <div class='card'><b>Catatan guru terakhir</b>${notes.map(g=>`<p>${esc(g.date)} - ${esc(g.category)}: ${esc(g.note)} <span class='mu'>(${esc(g.by)})</span></p>`).join('')||`<p class='mu'>Belum ada catatan.</p>`}<b>Rekomendasi</b><ul>${rec(a).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`}
const secsFor=(n,s,a,pre)=>[{t:pre+'Identitas',head:['Data','Isi'],rows:[['NIS',n],['Nama',s.name],['Jenis kelamin',s.gender||'-'],['Kelas',cls(s.classId)],['Periode',s.joined||'-'],['Selesai',s.ended||'-'],['Status',s.status||'-']]},{t:pre+'Absensi',head:['Hadir','Izin','Sakit','Alpa','Libur','% Kehadiran','Kategori'],rows:[[a.at.H,a.at.I,a.at.S,a.at.A,a.at.L,a.pct===null?'-':a.pct+'%',catT(a.pct)]]},{t:pre+'Nilai per kategori',head:['Kategori','Rata-rata','Predikat'],rows:[...Object.entries(a.cats).map(([c,v])=>[c,v,gl(v)]),['RATA-RATA KESELURUHAN',a.av??'-',gl(a.av)]]},{t:pre+'Perkembangan per 2 minggu',head:['Periode mulai','Rata-rata','Jumlah penilaian'],rows:a.pr.map(([k,v,c])=>[pl(k),v,c])},{t:pre+'Indikator',head:['Tren nilai','Status'],rows:[[a.tr,a.st]]},{t:pre+'Rekomendasi',head:['No','Rekomendasi'],rows:rec(a).map((x,i)=>[i+1,x])}];
function mon2(m){
 if(window._mm===undefined)window._mm=month();const mo=window._mm;
 const sel=window._mset=window._mset||{};Object.keys(sel).forEach(k=>{if(!S.students[k])delete sel[k]});
 if(window._mc&&!S.classes[window._mc])window._mc='';
 const all=Object.entries(S.students).sort((a,b)=>a[1].name.localeCompare(b[1].name)),mq=(window._mq||'').toLowerCase().trim();
 const fl=all.filter(([i,x])=>(!window._mc||x.classId===window._mc)&&(!mq||(i+' '+x.name).toLowerCase().includes(mq)));
 const ns=all.map(x=>x[0]).filter(n=>sel[n]),D=ns.map(n=>({n,s:S.students[n],a:an(n,mo)}));
 let body=`<p class='mu'>Klik nama siswa di atas untuk melihat monitoring. Bisa memilih lebih dari satu.</p>`;
 if(D.length===1)body=monDetail(D[0].n,mo);
 else if(D.length>1)body=`<div class='card'><b>Perbandingan ${D.length} siswa</b> <span class='mu'>(${mo||'semua periode'})</span><div class='tw'><table><tr><th>NIS</th><th>Nama</th><th>Kelas</th><th>H</th><th>I</th><th>S</th><th>A</th><th>L</th><th>% Hadir</th><th>Rata nilai</th><th>Predikat</th><th>Tren</th><th>Status</th></tr>${D.map(({n,s,a})=>`<tr><td>${esc(n)}</td><td>${esc(s.name)}</td><td>${esc(cls(s.classId))}</td><td>${a.at.H}</td><td>${a.at.I}</td><td>${a.at.S}</td><td>${a.at.A}</td><td>${a.at.L}</td><td>${a.pct===null?'-':a.pct+'%'}</td><td>${a.av??'-'}</td><td>${gl(a.av)}</td><td>${a.tr}</td><td>${stb(a.st)}</td></tr>`).join('')}</table></div></div>`+D.map(({n,s,a})=>`<details style='margin-bottom:14px'><summary class='card' style='cursor:pointer;margin-bottom:8px'><b>${esc(s.name)}</b> <span class='mu'>${esc(n)} - ${esc(cls(s.classId))}</span> ${stb(a.st)}</summary>${monDetail(n,mo)}</details>`).join('');
 m.innerHTML=`<h2>Monitoring Siswa</h2><div class='card'><div class='row np' style='margin:0'><select id='mc'><option value=''>Semua kelas</option>${Object.entries(S.classes).map(([i,c])=>`<option value='${i}' ${i===window._mc?'selected':''}>${esc(c.name)}</option>`).join('')}</select><input id='mq' placeholder='Cari NIS atau nama' value='${esc(window._mq||'')}' style='width:200px'><input type='month' id='mm' value='${mo}'><span class='mu'>Kosongkan bulan untuk semua periode</span>${D.length&&can('export')?`<button class='b' id='mp'>Unduh PDF (${D.length})</button>`:''}</div>
 <div class='row np' style='margin:10px 0 0'><button class='g' id='ma'>Pilih semua yang tampil (${fl.length})</button><button class='g' id='mx'>Kosongkan pilihan</button><span class='mu'>Dipilih: ${D.length}</span></div>
 ${fl.length?`<div class='row np' style='margin:10px 0 0'>${fl.slice(0,80).map(([i,x])=>`<button class='${sel[i]?'b':'g'}' data-ms='${esc(i)}'>${esc(x.name)} <small>(${esc(i)})</small></button>`).join('')}${fl.length>80?`<span class='mu'>+${fl.length-80} lainnya, persempit pencarian</span>`:''}</div>`:`<p class='mu' style='margin:10px 0 0'>Tidak ada siswa yang cocok.</p>`}</div>${body}${perh(mo)}`;
 $('#mc').onchange=e=>{window._mc=e.target.value;dirty=false;render()};
 $('#mq').oninput=e=>{window._mq=e.target.value;const p=e.target.selectionStart;dirty=false;render();const x=$('#mq');x.focus();x.setSelectionRange(p,p)};
 $('#mm').onchange=e=>{window._mm=e.target.value;dirty=false;render()};
 $('#ma').onclick=()=>{fl.forEach(([i])=>sel[i]=1);dirty=false;render()};$('#mx').onclick=()=>{Object.keys(sel).forEach(k=>delete sel[k]);dirty=false;render()};
 m.querySelectorAll('[data-ms]').forEach(b=>b.onclick=()=>{const i=b.dataset.ms;if(sel[i])delete sel[i];else sel[i]=1;dirty=false;render()});
 if($('#mp'))$('#mp').onclick=()=>{const one=D.length===1;const secs=[];if(!one)secs.push({t:'Perbandingan siswa',head:['NIS','Nama','Kelas','% Hadir','Rata nilai','Tren','Status'],rows:D.map(({n,s,a})=>[n,s.name,cls(s.classId),a.pct===null?'-':a.pct+'%',a.av??'-',a.tr,a.st])});D.forEach(({n,s,a})=>secs.push(...secsFor(n,s,a,one?'':s.name+' - ')));pdf('Laporan Monitoring Siswa',one?'Nama: '+D[0].s.name+'  |  NIS: '+D[0].n+'  |  Kelas: '+cls(D[0].s.classId)+'  |  Periode: '+(mo||'Semua'):'Jumlah siswa: '+D.length+'  |  Periode: '+(mo||'Semua'),secs,'Monitoring-'+(one?D[0].n:'beberapa-siswa')+'.pdf','portrait')}}
function loginView(){
 $('#root').innerHTML=`<div id='login'><div class='card'><h2>Absensi Yoshida Gakkou</h2><p class='mu'>Masuk menggunakan email dan password akun testing yang diberikan Master Admin.</p><input id='em' type='email' placeholder='Email' autocomplete='username' style='width:100%;margin-bottom:8px'><input id='pw' type='password' placeholder='Password' autocomplete='current-password' style='width:100%;margin-bottom:10px'><button class='b' id='go' style='width:100%'>Masuk</button><p id='er' class='bad'></p></div></div>`;
 const go=async()=>{const er=$('#er');er.textContent='';try{const {error}=await window.ygSupabase.auth.signInWithPassword({email:$('#em').value.trim().toLowerCase(),password:$('#pw').value});if(error)throw error;}catch(e){er.textContent='Login gagal: '+(e.message||'Periksa email dan password.')}};
 $('#go').onclick=go;$('#pw').onkeydown=e=>{if(e.key==='Enter')go()}
}
function pwView(){
 $('#root').innerHTML=`<div id='login'><div class='card'><h2>Ganti password</h2><p class='mu'>Masukkan password baru untuk akun Anda.</p><input id='p1' type='password' placeholder='Password baru (min 8 karakter)' autocomplete='new-password' style='width:100%;margin-bottom:8px'><input id='p2' type='password' placeholder='Ulangi password baru' autocomplete='new-password' style='width:100%;margin-bottom:10px'><button class='b' id='go' style='width:100%'>Simpan password</button><button class='g' id='cx' style='width:100%;margin-top:8px'>Batal</button><p id='er' class='bad'></p></div></div>`;
 $('#cx').onclick=()=>{window._cpw=false;render()};
 $('#go').onclick=async()=>{const p1=$('#p1').value,p2=$('#p2').value,er=$('#er');if(p1.length<8){er.textContent='Password minimal 8 karakter.';return}if(p1!==p2){er.textContent='Password tidak sama.';return}const {error}=await window.ygSupabase.auth.updateUser({password:p1});if(error){er.textContent='Gagal mengganti password: '+error.message;return}window._cpw=false;await log('akun','Ganti password');toast('Password tersimpan.');render()}
}
function logv(m){if(!adm()){m.innerHTML=denied('Riwayat Perubahan');return}m.innerHTML=`<h2>Riwayat Perubahan</h2><div class="card tw"><table><tr><th>Waktu</th><th>Oleh</th><th>Aksi</th><th>Detail</th></tr>${S.audit.map(a=>`<tr><td>${new Date(a.at).toLocaleString("id-ID")}</td><td>${esc(a.by)}</td><td>${esc(a.action)}</td><td style="white-space:normal">${esc(a.detail)}</td></tr>`).join("")}</table></div>`}
init();
